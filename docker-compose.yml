version: "3.9"
services:
  # 1. SVELTE FRONTEND SERVICE (NEW)
  astro_svelte:
    build:
      context: .
      dockerfile: Dockerfile_Svelte
    container_name: svelte_frontend
    networks:
      - vika-net
    ports:
      - 3008:3000 # Expose Svelte frontend on host port 3000
    restart: unless-stopped
  # 2. FASTAPI BACKEND SERVICE (MODIFIED)
  astroplanner-api:
    build:
      context: .
      dockerfile: Dockerfile_Api
    container_name: astroplanner-api
    networks:
      - vika-net
    ports:
      - 7007:8000
    restart: unless-stopped
    environment:
      # Use the internal service name 'mariadb'
      - DATABASE_URL=mysql+pymysql://root:rootpass@mariadb:3306/astrodb
      # Add the FRONTEND_URL for CORS configuration in FastAPI
      - FRONTEND_URL=https://astro.vlousada.me
    volumes:
      - ./app:/app
    # IMPORTANT: Remove the host port mapping (7007:8000)
    # Caddy will access the API internally on port 8000
    depends_on:
      - mariadb
  # 3. MARIADB DATABASE SERVICE (UNCHANGED)
  mariadb:
    image: mariadb:11
    container_name: astro-db
    networks:
      - vika-net
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: astrodb
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
    volumes:
      - mariadb_data:/var/lib/mysql
    # IMPORTANT: Remove the host port mapping (3306:3306)
    # Only the API needs access, which is internal.

    # 4. PHPMYADMIN SERVICE (UNCHANGED)
  phpmyadmin:
    depends_on:
      - mariadb
    image: phpmyadmin:latest
    restart: unless-stopped
    container_name: astro-phpmyadmin
    networks:
      - vika-net
    ports:
      - 8088:80
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: rootpass
      UPLOAD_LIMIT: 128M
volumes:
  mariadb_data: null
networks:
  vika-net:
    external: true
